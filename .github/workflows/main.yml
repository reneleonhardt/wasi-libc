name: CI
on:
  push:
    branches: [ci/wasip3-async-name-lookup]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  buildlibc:
    if: github.repository == 'reneleonhardt/wasi-libc'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test wasm32-wasip3 (debug)
            os: ubuntu-26.04
            clang_version: wasi-sdk-34.0-rc.3
            test: true
            args: -DCMAKE_BUILD_TYPE=Debug -DTARGET_TRIPLE=wasm32-wasip3

          - name: Test wasm32-wasip3 coop-threads
            os: ubuntu-26.04
            clang_version: wasi-sdk-34.0-rc.3
            test: true
            args: -DTARGET_TRIPLE=wasm32-wasip3 -DENABLE_COOP_THREADS=ON

          - name: Test wasm32-wasip3 coop-threads (debug)
            os: ubuntu-26.04
            clang_version: wasi-sdk-34.0-rc.3
            test: true
            args: -DCMAKE_BUILD_TYPE=Debug -DTARGET_TRIPLE=wasm32-wasip3 -DENABLE_COOP_THREADS=ON
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: ./.github/actions/setup
      with:
        clang_version: ${{ matrix.clang_version }}

    - name: Configure libc
      run: |
        cmake -G Ninja -S . -B build \
          -DCHECK_SYMBOLS=ON \
          ${{ matrix.args }} \
          -DCMAKE_LINK_DEPENDS_USE_LINKER=OFF

    - name: Configure testing
      if: matrix.test
      run: cmake -S . -B build -DENABLE_WERROR=ON -DBUILD_TESTS=ON

    - name: Build
      run: ninja -C build -v

    - name: Test
      if: matrix.test
      run: ctest --test-dir build/test --output-on-failure -j4

  ci-status:
    name: Record the result of this workflow
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs: [buildlibc]
    if: always() && github.repository == 'reneleonhardt/wasi-libc'
    steps:
    - name: calculate the correct exit status
      run: jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'
